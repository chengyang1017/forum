name: glyphora_mobile
description: "Glyphora multilingual community mobile client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  image_picker: ^1.1.2
  firebase_storage: ^12.1.0
  share_plus: ^10.0.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.0
  provider: ^6.1.5+1
  lpinyin: ^2.0.3
  pinyin: ^3.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  json_annotation: ^4.12.0
  app_links: ^7.2.1
  firebase_database: ^11.3.10
  glyphora_ui:
    git:
      url: https://github.com/chengyang1017/glyphora_ui.git
      ref: ec5c4c6966a5834c2f00ffc3bc277c3457bdde34
  flutter_quill: 11.5.1
  flutter_quill_extensions: 11.0.0
  glyphora_language_core:
    git:
      url: https://github.com/chengyang1017/flutter-languages-config.git
      ref: ff9aab0ccfe92b0180a9ee77c161ba6ffef69d4a
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/

  fonts:
    - family: NomNaTong
      fonts:
        - asset: assets/fonts/NomNaTong-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
