name: Validate auth localization

on:
  push:
    branches:
      - fix/localize-auth-security-ui

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply auth localization migration
        run: python .github/scripts/apply_auth_localization.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get

      - name: Collect changed Dart files
        run: |
          {
            git diff --name-only origin/main...HEAD -- 'apps/mobile-flutter/**/*.dart'
            git diff --name-only -- 'apps/mobile-flutter/**/*.dart'
          } | sort -u > /tmp/changed_dart.txt
          cat /tmp/changed_dart.txt

      - name: Format changed Dart files
        run: |
          if [ -s /tmp/changed_dart.txt ]; then
            xargs dart format < /tmp/changed_dart.txt
          fi

      - name: Analyze changed Dart files
        working-directory: apps/mobile-flutter
        run: |
          sed 's#^apps/mobile-flutter/##' /tmp/changed_dart.txt > /tmp/changed_dart_relative.txt
          if [ -s /tmp/changed_dart_relative.txt ]; then
            xargs dart analyze < /tmp/changed_dart_relative.txt
          fi

      - name: Run localization tests
        working-directory: apps/mobile-flutter
        run: flutter test test/app/l10n/localization_assets_test.dart

      - name: Check diff
        run: git diff --check

      - name: Commit validated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "fix: localize auth and security flows"
          git push origin HEAD:fix/localize-auth-security-ui
