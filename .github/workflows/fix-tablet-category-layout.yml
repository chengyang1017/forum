name: Fix tablet category layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-tablet-category-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply responsive tablet layout
        run: python3 .github/scripts/fix_tablet_category_layout.py

      - name: Validate diff
        run: git diff --check

      - name: Commit responsive fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/features/home/presentation/screens/home_tab.dart
          git commit -m "fix: compact category grid on tablets"
          git push origin main
