name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete merged branches
        shell: bash
        run: |
          branches=(
            "cleanup/auth-presentation-dead-code"
            "feat/hierarchical-language-channel-picker"
            "fix/post-edit-media-lifecycle"
            "refactor/account-security"
            "refactor/auth-boundary"
            "refactor/chat-boundary"
            "refactor/chat-live-draft-boundary"
            "refactor/chat-remove-legacy-models"
            "refactor/create-post-boundaries"
            "refactor/discover-boundary"
            "refactor/enterprise-post-architecture"
            "refactor/login-boundaries"
            "refactor/my-profile-auth-boundary"
            "refactor/notes-boundary"
            "refactor/notes-presentation"
            "refactor/post-boundaries-and-tests"
            "refactor/post-detail-domain-boundaries"
            "refactor/post-detail-screen-repository"
            "refactor/post-domain-mapper"
            "refactor/post-presentation-dependencies"
            "refactor/post-rich-edit-media"
            "refactor/profile-data-boundary"
            "refactor/profile-post-repository"
            "refactor/register-username-boundary"
            "refactor/social-boundary"
            "refactor/user-name-display-boundary"
            "refactor/users-directory"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already gone: $branch"
            fi
          done
