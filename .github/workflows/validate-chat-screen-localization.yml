name: Validate chat screen localization

on:
  push:
    branches:
      - fix/localize-chat-screen

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply chat localization migration
        run: python .github/scripts/apply_chat_screen_localization.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get
      - name: Format chat screen
        working-directory: apps/mobile-flutter
        run: dart format lib/features/chat/presentation/screens/chat_screen.dart
      - name: Analyze chat screen
        working-directory: apps/mobile-flutter
        run: dart analyze lib/features/chat/presentation/screens/chat_screen.dart
      - name: Run localization tests
        working-directory: apps/mobile-flutter
        run: flutter test test/app/l10n/localization_assets_test.dart
      - name: Check diff
        run: git diff --check
      - name: Commit validated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "fix: localize chat screen interactions"
          git push origin HEAD:fix/localize-chat-screen
