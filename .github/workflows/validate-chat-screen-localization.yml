name: Validate chat screen localization

on:
  push:
    branches:
      - fix/localize-chat-screen

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply chat localization migration
        run: python .github/scripts/apply_chat_screen_localization.py
      - name: Repair generated const/localization lookups
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile-flutter/lib/features/chat/presentation/screens/chat_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace('label: Text(l10n.retry),', "label: Text(l10n.get('retry')),")
          text = text.replace('AppLocalizations.of(context)!.sendFailed', "AppLocalizations.of(context)!.get('sendFailed')")
          text = text.replace("decoration: const InputDecoration(\n              hintText: AppLocalizations.of(context)!.get('messageInputHint'),", "decoration: InputDecoration(\n              hintText: AppLocalizations.of(context)!.get('messageInputHint'),")
          text = text.replace("child: const Text(\n                                        AppLocalizations.of(context)!.get('typing'),", "child: Text(\n                                        AppLocalizations.of(context)!.get('typing'),")
          text = text.replace("child: const Row(\n                                      mainAxisSize: MainAxisSize.min,", "child: Row(\n                                      mainAxisSize: MainAxisSize.min,")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get
      - name: Format chat screen
        working-directory: apps/mobile-flutter
        run: dart format lib/features/chat/presentation/screens/chat_screen.dart
      - name: Analyze chat screen
        working-directory: apps/mobile-flutter
        run: dart analyze lib/features/chat/presentation/screens/chat_screen.dart
      - name: Run localization tests
        working-directory: apps/mobile-flutter
        run: flutter test test/app/l10n/localization_assets_test.dart
      - name: Check diff
        run: git diff --check
      - name: Commit validated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "fix: localize chat screen interactions"
          git push origin HEAD:fix/localize-chat-screen
