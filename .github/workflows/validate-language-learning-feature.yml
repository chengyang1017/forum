name: Validate Language Learning Feature

on:
  push:
    branches:
      - feature/language-learning-subcategories
    paths:
      - ".github/workflows/validate-language-learning-feature.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/language-learning-subcategories

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Format feature files
        run: |
          dart format \
            lib/core/constants/forum_categories.dart \
            lib/features/feed/presentation/screens/feed_screen.dart \
            test/core/constants/forum_categories_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Validate diff
        run: git diff --check
        working-directory: .

      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet -- apps/mobile-flutter/lib/core/constants/forum_categories.dart apps/mobile-flutter/lib/features/feed/presentation/screens/feed_screen.dart apps/mobile-flutter/test/core/constants/forum_categories_test.dart; then
            echo "Feature files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/core/constants/forum_categories.dart apps/mobile-flutter/lib/features/feed/presentation/screens/feed_screen.dart apps/mobile-flutter/test/core/constants/forum_categories_test.dart
          git commit -m "style: format language-learning feature"
          git push origin HEAD:feature/language-learning-subcategories
