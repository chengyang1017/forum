name: Fix category overview equal height

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-category-overview-equal-height.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply equal-height fix
        run: python3 .github/scripts/fix_category_overview_equal_height.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get

      - name: Format page
        working-directory: apps/mobile-flutter
        run: dart format lib/features/home/presentation/screens/home_tab.dart

      - name: Analyze page
        working-directory: apps/mobile-flutter
        run: flutter analyze lib/features/home/presentation/screens/home_tab.dart

      - name: Validate diff
        run: git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/features/home/presentation/screens/home_tab.dart
          git commit -m "fix: align category overview card heights"
          git push origin main
