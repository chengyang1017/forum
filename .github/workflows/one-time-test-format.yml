name: One-time test format

on:
  push:
    branches:
      - fix/flutter-i18n-sweep

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/flutter-i18n-sweep
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Format updated tests
        working-directory: apps/mobile-flutter
        run: |
          dart format \
            test/app/l10n/localization_assets_test.dart \
            test/features/auth/presentation/cubit/auth_cubit_test.dart
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/test
          git commit -m "chore: format updated localization tests"
          git push origin HEAD:fix/flutter-i18n-sweep
