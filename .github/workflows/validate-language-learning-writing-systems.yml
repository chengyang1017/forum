name: Validate language-learning writing systems

on:
  push:
    branches:
      - fix/language-learning-writing-systems

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/core/constants/forum_categories.dart test/core/constants/forum_categories_test.dart

      - name: Analyze feature files
        run: dart analyze lib/core/constants/forum_categories.dart test/core/constants/forum_categories_test.dart

      - name: Run category tests
        run: flutter test test/core/constants/forum_categories_test.dart
