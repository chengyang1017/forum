name: Validate language-learning writing systems

on:
  push:
    branches:
      - fix/language-learning-writing-systems

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format feature files
        run: dart format lib/core/constants/forum_categories.dart test/core/constants/forum_categories_test.dart

      - name: Analyze feature files
        run: dart analyze lib/core/constants/forum_categories.dart test/core/constants/forum_categories_test.dart

      - name: Run category tests
        run: flutter test test/core/constants/forum_categories_test.dart

      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet -- apps/mobile-flutter/lib/core/constants/forum_categories.dart apps/mobile-flutter/test/core/constants/forum_categories_test.dart; then
            echo "Feature files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/core/constants/forum_categories.dart apps/mobile-flutter/test/core/constants/forum_categories_test.dart
          git commit -m "style: format language-learning writing systems"
          git push origin HEAD:fix/language-learning-writing-systems
