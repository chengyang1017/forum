name: Cleanup Midnight Temp Branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-midnight-temp-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branches
        shell: bash
        run: |
          for branch in \
            fix/midnight-mode-remaining-surfaces \
            fix/midnight-mode-remaining-surfaces-2 \
            fix/midnight-mode-surfaces \
            fix/midnight-mode-surfaces-final \
            fix/midnight-mode-surfaces-final-2 \
            fix/midnight-mode-surfaces-work
          do
            git push origin --delete "$branch" || true
          done

      - name: Remove cleanup workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-midnight-temp-branches.yml
          git config user.name "Lim Cheng Yang"
          git config user.email "chengyang1017@gmail.com"
          git add .github/workflows/cleanup-midnight-temp-branches.yml
          git commit -m "chore: remove temporary midnight cleanup workflow"
          git push origin main
