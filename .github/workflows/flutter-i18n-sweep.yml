name: Flutter i18n cleanup

on:
  push:
    branches:
      - fix/flutter-i18n-sweep

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/flutter-i18n-sweep
          fetch-depth: 0

      - name: Restore unrelated formatting and remove one-time tools
        run: |
          git fetch origin main
          git checkout origin/main -- \
            apps/mobile-flutter/lib/app/cubit/app_language_state.dart \
            apps/mobile-flutter/lib/app/theme/app_theme.dart \
            apps/mobile-flutter/lib/features/chat/presentation/cubit/chat_state.dart \
            apps/mobile-flutter/lib/features/discover/presentation/cubit/discover_state.dart \
            apps/mobile-flutter/lib/features/feed/presentation/cubit/feed_state.dart \
            apps/mobile-flutter/lib/features/home/presentation/widgets/recommended_posts_view.dart \
            apps/mobile-flutter/lib/features/profile/presentation/widgets/profile_bio_tags_section.dart \
            apps/mobile-flutter/lib/features/social/presentation/cubit/friend_state.dart \
            apps/mobile-flutter/test/features/auth/presentation/cubit/auth_cubit_test.dart \
            apps/mobile-flutter/test/features/chat/data/repositories/firebase_chat_media_repository_test.dart \
            apps/mobile-flutter/test/features/chat/presentation/cubit/chat_cubit_test.dart \
            apps/mobile-flutter/test/features/discover/presentation/cubit/discover_cubit_test.dart \
            apps/mobile-flutter/test/features/feed/presentation/cubit/feed_cubit_test.dart \
            apps/mobile-flutter/test/features/profile/data/repositories/profile_repository_impl_test.dart \
            apps/mobile-flutter/test/features/profile/presentation/cubit/profile_cubit_test.dart

          rm -f \
            apps/mobile-flutter/tool/migrate_hardcoded_ui_to_arb.py \
            apps/mobile-flutter/tool/patch_remaining_i18n.py \
            apps/mobile-flutter/tool/patch_contextless_i18n.py

          sed -i '/^synthetic-package:/d' apps/mobile-flutter/l10n.yaml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "chore(i18n): remove migration artifacts and unrelated formatting"
          git push origin HEAD:fix/flutter-i18n-sweep
