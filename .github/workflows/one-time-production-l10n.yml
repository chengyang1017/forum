name: One-time production readiness patch

on:
  push:
    branches:
      - feat/production-readiness

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-readiness

      - name: Update localization files
        working-directory: apps/mobile-flutter
        run: python tool/add_production_l10n.py

      - name: Apply moderation visibility filters
        working-directory: apps/api
        run: python tool/patch_moderation_visibility.py

      - name: Commit generated source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile-flutter/lib/l10n/app_*.arb \
            apps/api/src/routes/post_route.ts \
            apps/api/src/routes/post_data_route.ts \
            apps/api/src/routes/bookmark_route.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: apply production-readiness generated updates"
          git push origin HEAD:feat/production-readiness
