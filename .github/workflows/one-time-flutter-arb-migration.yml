name: One-time Flutter ARB migration

on:
  push:
    branches:
      - refactor/flutter-arb-l10n

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flutter-arb-l10n

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run localization migration
        run: python apps/mobile-flutter/tool/migrate_l10n_to_arb.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Generate Flutter localizations
        working-directory: apps/mobile-flutter
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/app/l10n/app_localizations.dart

      - name: Verify localization integration
        working-directory: apps/mobile-flutter
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/features/profile/birthday_editor_dialog_test.dart

      - name: Commit migrated localization sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor(l10n): migrate Flutter UI translations to ARB"
          git push origin HEAD:refactor/flutter-arb-l10n
