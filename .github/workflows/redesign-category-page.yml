name: Redesign category page

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/redesign-category-page.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply redesign
        run: python3 .github/scripts/redesign_category_page.py

      - name: Validate diff
        run: git diff --check

      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-flutter/lib/features/home/presentation/screens/home_tab.dart
          git commit -m "refactor: redesign adaptive forum categories page"
          git push origin main
