name: One-time moderation read barrier

on:
  push:
    branches:
      - feat/production-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-readiness

      - name: Patch direct post and comment reads
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          post_path = Path('apps/api/src/routes/post_route.ts')
          post_text = post_path.read_text(encoding='utf-8')
          get_marker = '// GET /api/v1/posts/:id'
          marker_index = post_text.find(get_marker)
          if marker_index == -1:
              raise SystemExit('single-post route marker not found')

          prefix = post_text[:marker_index]
          tail = post_text[marker_index:]
          if 'where:\n            postWhereById(id),' not in tail:
              pattern = re.compile(
                  r"const validDatabaseId\s*=\s*"
                  r"z\.string\(\)\s*\.uuid\(\)\s*\.safeParse\(id\);\s*"
                  r"const post\s*=\s*await prisma\.post\.findFirst\(\{\s*"
                  r"where:\s*validDatabaseId\.success\s*\?\s*\{\s*"
                  r"OR:\s*\[\s*\{\s*firestoreId:\s*id,\s*\},\s*"
                  r"\{\s*id,\s*\},\s*\],\s*\}\s*:\s*"
                  r"\{\s*firestoreId:\s*id,\s*\},",
                  re.DOTALL,
              )
              replacement = '''const post =
                await prisma.post.findFirst({
                  where:
                    postWhereById(id),'''
              tail, count = pattern.subn(replacement, tail, count=1)
              if count != 1:
                  raise SystemExit(f'single-post moderation patch matched {count} blocks')
              post_path.write_text(prefix + tail, encoding='utf-8')

          comment_path = Path('apps/api/src/routes/comment_route.ts')
          comment_text = comment_path.read_text(encoding='utf-8')
          helper_pattern = re.compile(
              r"async function findPost\(\s*id: string,\s*\)\s*\{.*?\n\}\s*\n\s*"
              r"async function findCurrentUser",
              re.DOTALL,
          )
          helper_match = helper_pattern.search(comment_text)
          if helper_match is None:
              raise SystemExit('comment findPost helper boundary not found')

          helper_text = helper_match.group(0)
          if "status: 'actioned'" not in helper_text:
              replacement = '''async function findPost(
            id: string,
          ) {
            const isDatabaseId =
              z.string().uuid().safeParse(id).success;

            return prisma.post.findFirst({
              where: {
                ...(isDatabaseId
                  ? {
                      OR: [
                        { firestoreId: id },
                        { id },
                      ],
                    }
                  : { firestoreId: id }),
                reports: {
                  none: {
                    status: 'actioned',
                  },
                },
              },
              select: {
                id: true,
              },
            });
          }

          async function findCurrentUser'''
              comment_text, count = helper_pattern.subn(
                  replacement,
                  comment_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'comment moderation patch matched {count} helpers')
              comment_path.write_text(comment_text, encoding='utf-8')
          PY

      - name: Commit barriers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/post_route.ts apps/api/src/routes/comment_route.ts
          if git diff --cached --quiet; then
            echo "No moderation barrier changes needed."
            exit 0
          fi
          git commit -m "fix(moderation): block direct reads of hidden posts"
          git push origin HEAD:feat/production-readiness
