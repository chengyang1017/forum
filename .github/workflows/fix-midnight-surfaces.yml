name: Patch Remaining Midnight Surfaces

on:
  push:
    branches:
      - fix/midnight-mode-surfaces
    paths:
      - ".github/workflows/fix-midnight-surfaces.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/midnight-mode-surfaces
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Patch remaining light-only surfaces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('apps/mobile-flutter/lib')

          def edit(rel, replacements):
              path = root / rel
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'updated {rel}')
              else:
                  print(f'no changes {rel}')

          surface = 'Theme.of(context).colorScheme.surface'
          on_surface = 'Theme.of(context).colorScheme.onSurface'
          on_surface_variant = 'Theme.of(context).colorScheme.onSurfaceVariant'
          outline = 'Theme.of(context).colorScheme.outlineVariant'
          surface_high = 'Theme.of(context).colorScheme.surfaceContainerHighest'
          scaffold = 'Theme.of(context).scaffoldBackgroundColor'

          # Screens that hard-coded white page/app-bar backgrounds.
          for rel in [
              'features/auth/presentation/screens/login_screen.dart',
              'features/discover/presentation/screens/discover_screen.dart',
              'features/social/presentation/screens/friends_list_screen.dart',
              'features/chat/presentation/screens/chat_list_screen.dart',
              'features/chat/presentation/screens/chat_screen.dart',
              'features/post/presentation/screens/create_post_screen.dart',
              'features/notes/presentation/screens/note_editor_screen.dart',
              'features/post/presentation/screens/node_comment_screen.dart',
              'features/post/presentation/screens/post_detail_screen.dart',
              'features/profile/presentation/screens/my_profile_screen.dart',
              'features/profile/presentation/screens/user_profile_screen.dart',
          ]:
              edit(rel, [
                  ('backgroundColor: Colors.white,', f'backgroundColor: {surface},'),
                  ('foregroundColor: Colors.black87,', f'foregroundColor: {on_surface},'),
              ])

          edit('core/widgets/empty_state.dart', [
              ('style: const TextStyle(\n              fontSize: 16,\n              fontWeight: FontWeight.w600,\n              color: Colors.black87,\n            ),',
               f'style: TextStyle(\n              fontSize: 16,\n              fontWeight: FontWeight.w600,\n              color: {on_surface},\n            ),'),
          ])

          edit('features/chat/presentation/widgets/message_bubble.dart', [
              ('color: isMe ? Colors.blue.shade100 : Colors.white,',
               'color: isMe\n            ? Theme.of(context).colorScheme.primaryContainer\n            : Theme.of(context).colorScheme.surfaceContainerHighest,'),
              ('style: const TextStyle(fontSize: 16, color: Colors.black87),',
               f'style: TextStyle(fontSize: 16, color: {on_surface}),'),
          ])

          edit('features/chat/presentation/widgets/chat_input_bar.dart', [
              ('color: Colors.white,', f'color: {surface},'),
              ('color: Colors.grey[600],', f'color: {on_surface_variant},'),
              ('hintStyle: TextStyle(color: Colors.grey[400]),',
               f'hintStyle: TextStyle(color: {on_surface_variant}),'),
              ('fillColor: const Color(0xFFF5F5F5),', f'fillColor: {surface_high},'),
          ])

          edit('features/chat/presentation/screens/chat_list_screen.dart', [
              ('decoration: const BoxDecoration(\n                  color: Colors.white,',
               f'decoration: BoxDecoration(\n                  color: {surface},'),
              ('color: Colors.grey.shade100,\n              shape: BoxShape.circle,',
               f'color: {surface_high},\n              shape: BoxShape.circle,'),
              ('child: Icon(icon, size: 22, color: Colors.black87),',
               f'child: Icon(icon, size: 22, color: {on_surface}),'),
              ('icon: const Icon(\n                    Icons.person_add_rounded,\n                    size: 26,\n                    color: Colors.black87,\n                  ),',
               f'icon: Icon(\n                    Icons.person_add_rounded,\n                    size: 26,\n                    color: {on_surface},\n                  ),'),
              ('border: Border.all(color: Colors.white, width: 1.5),',
               f'border: Border.all(color: {surface}, width: 1.5),'),
              ('color: Colors.grey.shade100)', f'color: {outline})'),
          ])

          edit('features/chat/presentation/screens/chat_screen.dart', [
              ('decoration: BoxDecoration(\n              color: Colors.white,\n              borderRadius: BorderRadius.circular(18),',
               f'decoration: BoxDecoration(\n              color: {surface_high},\n              borderRadius: BorderRadius.circular(18),'),
              ('border: Border.all(color: const Color(0xFFE8E8E8)),',
               f'border: Border.all(color: {outline}),'),
              ('style: const TextStyle(color: Colors.black87),',
               f'style: TextStyle(color: {on_surface}),'),
              ('icon: const Icon(Icons.note_alt_outlined, color: Colors.black87),',
               f'icon: Icon(Icons.note_alt_outlined, color: {on_surface}),'),
              ('icon: const Icon(Icons.call_outlined, color: Colors.black87),',
               f'icon: Icon(Icons.call_outlined, color: {on_surface}),'),
              ('icon: const Icon(Icons.videocam_outlined, color: Colors.black87),',
               f'icon: Icon(Icons.videocam_outlined, color: {on_surface}),'),
              ('icon: const Icon(Icons.more_vert, color: Colors.black87),',
               f'icon: Icon(Icons.more_vert, color: {on_surface}),'),
          ])

          edit('features/discover/presentation/screens/discover_screen.dart', [
              ('child: Divider(height: 1, thickness: 1, color: Colors.grey.shade200),',
               f'child: Divider(height: 1, thickness: 1, color: {outline}),'),
              ('color: Colors.grey.shade100,\n            indent: 72,',
               f'color: {outline},\n            indent: 72,'),
              ('style: const TextStyle(\n                              fontWeight: FontWeight.w600,\n                              fontSize: 15,\n                              color: Color(0xFF121212),\n                            ),',
               f'style: TextStyle(\n                              fontWeight: FontWeight.w600,\n                              fontSize: 15,\n                              color: {on_surface},\n                            ),'),
          ])

          edit('features/social/presentation/screens/friends_list_screen.dart', [
              ('icon: const Icon(\n                    Icons.person_add_rounded,\n                    size: 26,\n                    color: Colors.black87,\n                  ),',
               f'icon: Icon(\n                    Icons.person_add_rounded,\n                    size: 26,\n                    color: {on_surface},\n                  ),'),
              ('border: Border.all(color: Colors.white, width: 1.5),',
               f'border: Border.all(color: {surface}, width: 1.5),'),
              ('color: Colors.grey.shade50,\n                        shape: BoxShape.circle,',
               f'color: {surface_high},\n                        shape: BoxShape.circle,'),
              ('const Text(\n                      \'暂无好友\',\n                      style: TextStyle(\n                        fontSize: 16,\n                        fontWeight: FontWeight.w600,\n                        color: Colors.black87,\n                      ),\n                    )',
               f'Text(\n                      \'暂无好友\',\n                      style: TextStyle(\n                        fontSize: 16,\n                        fontWeight: FontWeight.w600,\n                        color: {on_surface},\n                      ),\n                    )'),
              ('style: const TextStyle(\n                                    fontSize: 15,\n                                    fontWeight: FontWeight.w600,\n                                    color: Colors.black87,\n                                  ),',
               f'style: TextStyle(\n                                    fontSize: 15,\n                                    fontWeight: FontWeight.w600,\n                                    color: {on_surface},\n                                  ),'),
              ('color: Colors.grey.shade100,', f'color: {surface_high},'),
          ])

          edit('features/profile/presentation/screens/my_profile_screen.dart', [
              ('backgroundColor: Colors.grey.shade100,', f'backgroundColor: {scaffold},'),
              ('icon: const Icon(Icons.settings_outlined, color: Colors.black87),',
               f'icon: Icon(Icons.settings_outlined, color: {on_surface}),'),
              ('const SliverToBoxAdapter(', 'SliverToBoxAdapter('),
              ('color: Colors.white,', f'color: {surface},'),
              ('style: const TextStyle(\n                            fontSize: 16,\n                            fontWeight: FontWeight.bold,\n                            color: Colors.black87,\n                          ),',
               f'style: TextStyle(\n                            fontSize: 16,\n                            fontWeight: FontWeight.bold,\n                            color: {on_surface},\n                          ),'),
          ])

          edit('features/profile/presentation/screens/user_profile_screen.dart', [
              ('backgroundColor: Colors.grey.shade100,', f'backgroundColor: {scaffold},'),
              ('child: Container(\n                    color: Colors.white,',
               f'child: Container(\n                    color: {surface},'),
              ('return Container(\n      color: Colors.white,\n      padding: const EdgeInsets.only(bottom: 24, left: 24, right: 24),',
               f'return Container(\n      color: {surface},\n      padding: const EdgeInsets.only(bottom: 24, left: 24, right: 24),'),
              ('return Container(\n      padding: const EdgeInsets.all(20),\n      color: Colors.white,',
               f'return Container(\n      padding: const EdgeInsets.all(20),\n      color: {surface},'),
              ('return Container(\n      margin: const EdgeInsets.only(top: 10),\n      color: Colors.white,',
               f'return Container(\n      margin: const EdgeInsets.only(top: 10),\n      color: {surface},'),
              ('style: const TextStyle(\n              fontSize: 22,\n              fontWeight: FontWeight.bold,\n              color: Colors.black87,\n            ),',
               f'style: TextStyle(\n              fontSize: 22,\n              fontWeight: FontWeight.bold,\n              color: {on_surface},\n            ),'),
          ])

          edit('features/profile/presentation/widgets/profile_header.dart', [
              ('return Container(\n      color: Colors.white,', f'return Container(\n      color: {surface},'),
              ('? Colors.black87\n                          : Colors.grey.shade400,',
               f'? {on_surface}\n                          : Colors.grey.shade400,'),
              ('border: Border.all(color: Colors.white, width: 4),',
               'border: Border.all(color: theme.colorScheme.surface, width: 4),'),
              ('border: Border.all(color: Colors.white, width: 2),',
               'border: Border.all(color: theme.colorScheme.surface, width: 2),'),
          ])

          edit('features/profile/presentation/widgets/profile_language_section.dart', [
              ('color: Colors.white,', f'color: {surface},'),
              ('color: Colors.grey.shade800,', f'color: {on_surface},'),
              ('style: const TextStyle(\n                                  fontWeight: FontWeight.w600,\n                                  fontSize: 13,\n                                  color: Colors.black87,\n                                ),',
               f'style: TextStyle(\n                                  fontWeight: FontWeight.w600,\n                                  fontSize: 13,\n                                  color: {on_surface},\n                                ),'),
              ('backgroundColor: Colors.grey.shade100,', f'backgroundColor: {surface_high},'),
          ])

          edit('features/social/presentation/widgets/follow_stats.dart', [
              ('style: const TextStyle(\n            fontSize: 20,\n            fontWeight: FontWeight.w800,\n            color: Colors.black87,\n          ),',
               f'style: TextStyle(\n            fontSize: 20,\n            fontWeight: FontWeight.w800,\n            color: {on_surface},\n          ),'),
          ])

          edit('features/notes/presentation/screens/user_notes_screen.dart', [
              ('return Material(\n      color: Colors.white,', f'return Material(\n      color: {surface},'),
          ])

          edit('features/post/presentation/screens/node_comment_screen.dart', [
              ('style: const TextStyle(\n                                fontSize: 15,\n                                color: Colors.black87,\n                                height: 1.3,\n                              ),',
               f'style: TextStyle(\n                                fontSize: 15,\n                                color: {on_surface},\n                                height: 1.3,\n                              ),'),
          ])

          edit('features/post/presentation/screens/post_detail_screen.dart', [
              ('decoration: const BoxDecoration(\n          color: Colors.white,\n          borderRadius: BorderRadius.vertical(top: Radius.circular(16)),\n        ),',
               f'decoration: BoxDecoration(\n          color: {surface},\n          borderRadius: const BorderRadius.vertical(top: Radius.circular(16)),\n        ),'),
              ('backgroundColor: Colors.white,', f'backgroundColor: {surface},'),
              ('foregroundColor: const Color(0xFF1E293B),', f'foregroundColor: {on_surface},'),
              ('decoration: BoxDecoration(\n                  color: Colors.white,\n                  borderRadius: BorderRadius.circular(12),',
               f'decoration: BoxDecoration(\n                  color: {surface_high},\n                  borderRadius: BorderRadius.circular(12),'),
              ('decoration: BoxDecoration(\n        color: Colors.white,\n        boxShadow:',
               f'decoration: BoxDecoration(\n        color: {surface},\n        boxShadow:'),
          ])

          # Remove the temporary workflow from the resulting feature commit.
          Path('.github/workflows/fix-midnight-surfaces.yml').unlink()
          PY

      - name: Format changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- 'apps/mobile-flutter/**/*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi

      - name: Install dependencies
        working-directory: apps/mobile-flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile-flutter
        run: dart analyze

      - name: Test
        working-directory: apps/mobile-flutter
        run: flutter test

      - name: Commit patched surfaces
        shell: bash
        run: |
          git config user.name "Lim Cheng Yang"
          git config user.email "chengyang1017@gmail.com"
          git add apps/mobile-flutter/lib .github/workflows/fix-midnight-surfaces.yml
          git commit -m "fix: complete midnight mode surface theming"
          git push origin HEAD:fix/midnight-mode-surfaces
